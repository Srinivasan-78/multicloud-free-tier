---
# claim -> fetch job -> decrypt creds -> terraform apply -> mark active.
# The rescue block rolls the row back to 'error' on any failure (auto-rollback),
# mirroring the try/except in the old Celery task.

- name: Claim - mark provisioning
  ansible.builtin.command:
    argv: [python3, "{{ bin_dir }}/db.py", set-status, "{{ resource_id }}", provisioning]
  changed_when: true

- name: Provision
  block:
    - name: Load job (resource row + encrypted credentials)
      ansible.builtin.command:
        argv: [python3, "{{ bin_dir }}/db.py", get-job, "{{ resource_id }}"]
      register: job_raw
      changed_when: false

    - name: Parse job
      ansible.builtin.set_fact:
        job: "{{ job_raw.stdout | from_json }}"

    - name: Credentials must exist for this provider
      ansible.builtin.assert:
        that: job.encrypted_payload | default('', true) | length > 0
        fail_msg: "no stored credentials for provider '{{ job.provider }}'"

    - name: Decrypt credential blob
      ansible.builtin.command:
        argv: [python3, "{{ bin_dir }}/crypto.py", decrypt]
        stdin: "{{ job.encrypted_payload }}"
      register: cred_raw
      changed_when: false
      no_log: true

    - name: Assemble workspace path + tfvars (locked spec + caller credentials)
      ansible.builtin.set_fact:
        workspace: "{{ terraform_root }}/tenants/{{ job.user_id }}/{{ job.provider }}"
        tfvars: "{{ job.spec | combine(cred_raw.stdout | from_json) }}"
      no_log: true

    - name: Ensure tenant workspace exists
      ansible.builtin.file:
        path: "{{ workspace }}"
        state: directory
        mode: "0750"

    - name: Find the provider's module .tf files
      ansible.builtin.find:
        paths: "{{ terraform_root }}/modules/{{ job.provider }}"
        patterns: "*.tf"
      register: module_tf

    - name: Module blueprint must exist
      ansible.builtin.assert:
        that: module_tf.matched > 0
        fail_msg: "no terraform module at modules/{{ job.provider }}"

    - name: Symlink blueprint into the workspace (one module, many tenant sandboxes)
      ansible.builtin.file:
        src: "{{ item.path }}"
        dest: "{{ workspace }}/{{ item.path | basename }}"
        state: link
        force: true
      loop: "{{ module_tf.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Write terraform.tfvars.json
      ansible.builtin.copy:
        content: "{{ tfvars | to_nice_json }}"
        dest: "{{ workspace }}/terraform.tfvars.json"
        mode: "0600"
      no_log: true

    - name: terraform init
      ansible.builtin.command:
        cmd: terraform init -input=false -no-color
        chdir: "{{ workspace }}"
      register: tf_init
      changed_when: "'successfully initialized' in tf_init.stdout"
      retries: 5
      delay: 2
      until: tf_init.rc == 0

    - name: terraform apply
      ansible.builtin.command:
        cmd: terraform apply -auto-approve -input=false -no-color
        chdir: "{{ workspace }}"
      register: tf_apply
      changed_when: "'Apply complete' in tf_apply.stdout"

    - name: terraform output -json
      ansible.builtin.command:
        cmd: terraform output -json -no-color
        chdir: "{{ workspace }}"
      register: tf_out
      changed_when: false

    - name: Persist outputs for the DB writer
      ansible.builtin.copy:
        content: "{{ tf_out.stdout }}"
        dest: "{{ workspace }}/.tfout.json"
        mode: "0600"

    - name: Mark active + arm the auto-destroy timer
      ansible.builtin.command:
        argv:
          - python3
          - "{{ bin_dir }}/db.py"
          - set-active
          - "{{ resource_id }}"
          - "{{ workspace }}/.tfout.json"
          - "{{ auto_destroy_hours }}"
      changed_when: true

    - name: "Event: provision.succeeded (Datadog-ready JSON line)"
      ansible.builtin.debug:
        msg: >-
          {{ {'event': 'provision.succeeded', 'resource_id': resource_id,
              'provider': job.provider} | to_json }}

  rescue:
    - name: Handle provision failure
      ansible.builtin.include_tasks: rescue.yml
      vars:
        failure_action: provision
