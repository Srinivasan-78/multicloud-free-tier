# Tear one resource down. Invoked by bin/worker.sh:
#   ansible-playbook -i 'localhost,' -c local ansible/destroy.yml -e resource_id=<uuid>
- name: Destroy free-tier resource
  hosts: localhost
  gather_facts: false
  tasks:
    - name: resource_id must be supplied
      ansible.builtin.assert:
        that:
          - resource_id is defined
          - resource_id | string | length > 0
        fail_msg: "pass -e resource_id=<uuid>"

    - name: Run the provisioner role
      ansible.builtin.include_role:
        name: provisioner
        tasks_from: destroy
