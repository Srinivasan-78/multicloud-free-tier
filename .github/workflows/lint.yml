name: lint
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: ruff (Flask app)
        run: pipx run --spec 'ruff==0.5.7' ruff check api

      - name: shellcheck (bin scripts)
        run: shellcheck api/bin/*.sh

      - name: ansible-lint (playbooks, advisory)
        run: pipx run --spec 'ansible-lint==24.7.0' ansible-lint api/ansible || echo "ansible-lint reported issues (non-blocking)"
